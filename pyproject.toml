[project]
name = "qortex-server"
version = "0.1.0"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (used by the Dockerfile).
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "mujoco>=3.1",
  "pydantic>=2",
  "psycopg[binary]>=3.1",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[tool.uv]
package = false

[tool.setuptools]
packages = ["server", "qortex_core", "worker"]

[tool.vercel]
entrypoint = "server.app:app"

[tool.vercel.scripts]
build = "python scripts/build_docs.py"
