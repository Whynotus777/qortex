site_name: Qortex Docs
site_description: Model routing and a cloud-to-robot policy pipeline
use_directory_urls: false
site_dir: site
theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features: [navigation.sections, navigation.expand, content.code.copy, navigation.footer, toc.follow]
  font: false
nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Guides:
      - Choosing a model: router.md
      - Sim evals and the deploy gate: evals.md
      - Distilling for the robot: distill.md
      - On-robot runtime: runtime.md
  - Robot types:
      - Arm: robots/arm.md
      - Mobile base: robots/mobile-base.md
      - Drone: robots/drone.md
      - Custom robot: robots/custom.md
  - Model catalog: models.md
  - API reference: api-reference.md
  - Self-hosting and workers: self-hosting.md
  - Status and limits: limits.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - tables
  - toc: {permalink: true}
plugins: [search]
