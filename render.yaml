services:
  - type: web
    name: qortex
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: QORTEX_DATA
        value: /data
      - key: QORTEX_WORKER_TOKEN
        generateValue: true
    disk:
      name: qortex-data
      mountPath: /data
      sizeGB: 1
